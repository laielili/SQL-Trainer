# 纯静态部署：将 docs/ 直接发布到 GitHub Pages。
# 原型（docs/index.html + 静态 JS/CSS/数据）无任何 Jekyll 依赖，
# 因此不走 Jekyll 构建，避免它扫描仓库根目录的 .py / .duckdb / .yaml 导致构建失败或根路径 404。
name: Deploy static prototype to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
