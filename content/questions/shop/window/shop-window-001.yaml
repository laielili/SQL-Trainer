id: shop-window-001
dataset: shop
scenario: window
chain: shop-window-chain-a
chain_step: 1
title: 每个用户最近一笔已完成订单

business_prompt: |
  客诉团队要回访，需要每个用户“最近一次成功支付”的那笔订单：
  “给我每个 user_id 最近一笔已完成（completed）订单的 order_id、实付金额和支付时间，
   按 user_id 升序。”

context_notes:
  - 只看 status='completed' 且 pay_time 非空的订单
  - “最近一笔”按 pay_time 最大，同一用户可能有多笔，只取一笔
  - MySQL 8.0 没有 QUALIFY，名次算出来后必须套一层 CTE / 子查询再过滤

tables: [orders]

expected_columns:
  - {name: user_id, type: int}
  - {name: order_id, type: int}
  - {name: pay_amount, type: decimal, tolerance: 0.01}
  - {name: pay_time, type: timestamp}

order_sensitive: false
row_limit: 1000

constraints: {}

hints:
  - 用 ROW_NUMBER() 按 user_id 分区、pay_time 降序排出名次。
  - 过滤“名次=1”不能写在 WHERE 里（窗口函数不在 WHERE 生效），要套 CTE。
  - 结果按 user_id 排序即可，pay_time 并列时取哪笔都行（可加次要排序键稳定）。

reference_sql: |
  WITH ranked AS (
      SELECT o.user_id,
             o.order_id,
             o.pay_amount,
             o.pay_time,
             ROW_NUMBER() OVER (
                 PARTITION BY o.user_id
                 ORDER BY o.pay_time DESC, o.order_id DESC
             ) AS rn
      FROM orders o
      WHERE o.status = 'completed'
        AND o.pay_time IS NOT NULL
  )
  SELECT user_id, order_id, pay_amount, pay_time
  FROM ranked
  WHERE rn = 1
  ORDER BY user_id;

alt_solutions:
  - |
    SELECT t.user_id, t.order_id, t.pay_amount, t.pay_time
    FROM (
        SELECT o.user_id, o.order_id, o.pay_amount, o.pay_time,
               ROW_NUMBER() OVER (
                   PARTITION BY o.user_id
                   ORDER BY o.pay_time DESC, o.order_id DESC
               ) AS rn
        FROM orders o
        WHERE o.status = 'completed' AND o.pay_time IS NOT NULL
    ) t
    WHERE t.rn = 1
    ORDER BY t.user_id;

explanation: |
  1. 排名：ROW_NUMBER() 分区 + 降序，给每个用户的最近订单标 rn=1。
  2. 过滤：窗口结果不能进 WHERE，用 CTE 或派生表包一层再 WHERE rn=1。
  3. 稳定：pay_time 相同加 order_id 次要键，保证每次结果一致。

pitfalls:
  - 试图在 WHERE 里直接写 ROW_NUMBER()=1
  - 用 MAX(pay_time) 相关子查询也能做，但本题训练窗口去重的写法
  - 没过滤 pay_time IS NOT NULL，未支付订单混入

capability_points: [window.dedup, window.rank_family]
