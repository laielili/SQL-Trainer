id: shop-retention-002
dataset: shop
scenario: retention
chain: shop-retention-chain-a
chain_step: 2
title: 按注册月分群的 7 日留存率

business_prompt: |
  增长同学要看“次周”留存：“按用户注册月份分群，统计每月注册人数，
   以及注册后 7 日内（含第 7 日）完成首次支付的人数与留存率。”

context_notes:
  - 首次支付 = MIN(pay_time) 且 status='completed'
  - 7 日口径：pay_time 落在 [注册日+1天, 注册日+7天]（闭区间）
  - 分母用当月注册人数；注册日上界取 2025-12-23，避免 +7 天推出数据范围

tables: [users, orders]

expected_columns:
  - {name: reg_month, type: string}
  - {name: reg_users, type: int}
  - {name: d7_retained, type: int}
  - {name: d7_rate, type: decimal, tolerance: 0.0001}

order_sensitive: false
row_limit: 1000

constraints: {}

hints:
  - 先按用户聚合出首次支付时间 MIN(pay_time)。
  - 7 日窗口用 BETWEEN 注册日+1天 AND 注册日+7天。
  - 分母用注册人数（LEFT JOIN 保住未支付用户）。

reference_sql: |
  WITH first_pay AS (
      SELECT user_id, MIN(pay_time) AS fp
      FROM orders
      WHERE status = 'completed' AND pay_time IS NOT NULL
      GROUP BY user_id
  )
  SELECT DATE_FORMAT(u.register_date, '%Y-%m') AS reg_month,
         COUNT(DISTINCT u.user_id) AS reg_users,
         COUNT(DISTINCT CASE
             WHEN fp.fp BETWEEN u.register_date + INTERVAL 1 DAY
                            AND u.register_date + INTERVAL 7 DAY
             THEN u.user_id END) AS d7_retained,
         ROUND(COUNT(DISTINCT CASE
             WHEN fp.fp BETWEEN u.register_date + INTERVAL 1 DAY
                            AND u.register_date + INTERVAL 7 DAY
             THEN u.user_id END) * 1.0
             / NULLIF(COUNT(DISTINCT u.user_id), 0), 4) AS d7_rate
  FROM users u
  LEFT JOIN first_pay fp ON fp.user_id = u.user_id
  WHERE u.register_date >= '2025-01-01' AND u.register_date <= '2025-12-23'
  GROUP BY 1
  ORDER BY 1;

alt_solutions:
  - |
    WITH first_pay AS (
        SELECT user_id, MIN(pay_time) AS fp
        FROM orders WHERE status='completed' AND pay_time IS NOT NULL GROUP BY user_id
    )
    SELECT DATE_FORMAT(u.register_date, '%Y-%m') AS reg_month,
           COUNT(DISTINCT u.user_id) AS reg_users,
           COUNT(DISTINCT CASE WHEN fp.fp >= u.register_date + INTERVAL 1 DAY
                               AND fp.fp <= u.register_date + INTERVAL 7 DAY
                               THEN u.user_id END) AS d7_retained,
           ROUND(COUNT(DISTINCT CASE WHEN fp.fp >= u.register_date + INTERVAL 1 DAY
                                   AND fp.fp <= u.register_date + INTERVAL 7 DAY
                                   THEN u.user_id END) * 1.0
               / NULLIF(COUNT(DISTINCT u.user_id), 0), 4) AS d7_rate
    FROM users u LEFT JOIN first_pay fp ON fp.user_id = u.user_id
    WHERE u.register_date >= '2025-01-01' AND u.register_date <= '2025-12-23'
    GROUP BY 1 ORDER BY 1;

explanation: |
  1. 锚点：首次支付 MIN(pay_time)。
  2. 7 日窗口：BETWEEN 注册日+1 与 +7（含边界）。
  3. 分母：LEFT JOIN 保住未支付用户，COUNT(DISTINCT user_id)。

pitfalls:
  - 用 INNER JOIN first_pay，分母变成有支付的人，留存率失真
  - 7 日窗口写错（漏掉第 7 日或把注册当日算进去）
  - 注册日上界没限制，+7 天推出 2026 无数据

capability_points: [retention.anchor, retention.nday, retention.denominator]
